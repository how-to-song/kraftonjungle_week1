<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>정글러 찾기</title>

    <!-- 구글폰트 -->
    <link href="https://fonts.googleapis.com/css?family=Stylish&display=swap" rel="stylesheet" />
</head>

<body class="bg-gray-200 min-h-screen">
    <form method="post" action="/edit" enctype="multipart/form-data">
        <div class="bg-white rounded-lg shadow my-10 max-w-md mx-auto p-10">
            <div class="space-y-4">
                <h1 class="text-5xl font-bold flex justify-center"> 회원정보 수정 </h1>

                {% if error_message %}
                <div class="bg-red-50 text-red-700 border border-red-200 rounded-md p-3 text-sm">{{ error_message }}
                </div>
                {% endif %}

                <div>
                    <input name="username" type="text" readonly value="{{ edit_user.username }}"
                        class="w-full border border-gray-300 bg-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-not-allowed"
                        placeholder="아이디 입력(4~20자)" />
                </div>

                <div>
                    <input name="password" type="password" readonly
                        class="w-full border border-gray-300 bg-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-not-allowed"
                        placeholder="비밀번호" />
                </div>

                <div>
                    <input name="password_confirm" type="password" readonly
                        class="w-full border border-gray-300 bg-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-not-allowed"
                        placeholder="비밀번호 확인" />
                </div>

                <div>
                    <label>프로필 사진</label>
                    <img src="{{ edit_user.profile_image}}" width="100">
                    <input name="profile_image" type="file" accept=".jpg,.jpeg,.png"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>

                <div>
                    <input name="name" type="text" value="{{ edit_user.name }}"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="이름을 입력해주세요." />
                </div>

                <div>
                    <div>
                        <h2 class="text-2xl font-bold text-center">다른 사람에게 알려주고 싶은 특징들을 적어주세요.</h2>
                        <p>특징에는 본인의 이름이나 아이디를 직접 적지 마세요</p>
                    </div>

                    <textarea name="feature1"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="특징을 입력하세요">{{ edit_user.features[0]}}</textarea>
                    <textarea name="feature2"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="특징을 입력하세요">{{ edit_user.features[1]}}</textarea>
                    <textarea name="feature3"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="특징을 입력하세요">{{ edit_user.features[2]}}</textarea>
                    <textarea name="feature4"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="특징을 입력하세요">{{ edit_user.features[3]}}</textarea>
                </div>

                <div class="flex justify-center">
                    <button type="submit" class="bg-lime-500 text-2xl font-bold text-white rounded-md p-3">저장하기</button>
                </div>
            </div>
        </div>
    </form>
</body>

</html>
