<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>정글러 찾기</title>

  <!-- 구글폰트 -->
  <link href="https://fonts.googleapis.com/css?family=Stylish&display=swap" rel="stylesheet" />
</head>

<body class="min-h-screen" style="background-image: url('/static/images/background.jpg');">

  <div class="bg-white rounded-lg shadow my-10 max-w-md mx-auto p-10">


    <h1 class="text-5xl font-bold flex justify-center my-3">로그인</h1>

    {% if request.args.get('kicked') %}
    <p class="text-red-500 text-center font-bold my-3">
      다른 기기에서 로그인되어 종료되었습니다.
    </p>
    {% endif %}

    {% if error_message %}
    <p>{{ error_message }}</p>
    {% endif %}



    <form method="post" action="/login">
      <label for="username"></label>
      <input id="username" type="text" name="username"
        class="w-full border border-gray-300 rounded-md px-3 py-2 my-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="아이디" required />

      <label for="password"></label>
      <input id="password" type="password" name="password"
        class="w-full border border-gray-300 rounded-md px-3 py-2 my-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="비밀번호" required />


      <div class="flex justify-center gap-3 m-5">
        <button type="submit" class="bg-lime-600 text-xl font-bold text-white rounded-md p-3">
          로그인
        </button>
        <a href="/signup" class="bg-lime-400 text-xl font-bold text-white rounded-md p-3">
          회원가입 </a>
      </div>
    </form>
  </div>

</body>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
